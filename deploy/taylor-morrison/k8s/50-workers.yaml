            # site discovery needs a cert-signed assertion (PEM bundle:
            # private key + cert; public .cer uploaded to the AAD app).
            - { name: SHAREPOINT_CERT_PEM_B64, valueFrom: { secretKeyRef: { name: tmvault-secrets, key: SHAREPOINT_CERT_PEM_B64 } } }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "2Gi" }
