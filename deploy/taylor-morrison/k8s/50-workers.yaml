---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backup-worker, namespace: itops, labels: { app: backup-worker, stack: tmvault } }
spec:
  replicas: 10
  # maxSurge=0 keeps the pool under the itops memory ResourceQuota during a
  # roll (no extra surge pod at 6Gi). Bumped to 6Gi 2026-06-18 — combined
  # chat-heavy (CHAT-ATT) + onedrive-partition load OOMKilled the 3Gi pool.
  strategy: { rollingUpdate: { maxSurge: 0, maxUnavailable: 1 } }
  selector: { matchLabels: { app: backup-worker } }
  template:
    metadata: { labels: { app: backup-worker, stack: tmvault } }
    spec:
      imagePullSecrets: [ { name: harbor-creds } ]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backup-worker
          image: harbor.taylormorrison.com/library/tmvault-backup-worker@sha256:67952dba9a217c119b090455a84c717efc65bada5548528ee363fe9dc9cddf60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
          envFrom: [ { configMapRef: { name: tmvault-config } }, { secretRef: { name: tmvault-secrets } } ]
          env:
            # Concurrent OneDrive backups per light-pool replica. Safe at 2
            # now that the huge-file segment RAM pool is cgroup-bounded
            # (worker-scoped ~1GiB shared across concurrent backups, not
            # multiplied per-backup) and the limit is 3Gi. Was 1 during the
            # OOM mitigation; raise further only with memory observation.
            - { name: MAX_CONCURRENT_ONEDRIVE_BACKUPS_PER_WORKER, value: "2" }
            - { name: BACKUP_CHATS_PARTITION_PREFETCH, value: "2" }  # 2026-10-15: prefetch == per-tenant cap (2) so pods stop hoarding claimed shards
            - { name: BACKUP_MAIL_PARTITION_PREFETCH,  value: "2" }
            # Cap concurrent per-shard chat drains. Default 32 OOM-killed the
            # 6Gi pool under combined chat (CHAT-ATT hosted-content) load
            # 2026-06-18 — orphaning partitions so snapshots never finalized.
            # 16 bounds peak memory under 6Gi. Raise only with memory headroom.
            - { name: USER_CHATS_PARALLEL_CHATS, value: "16" }
            - { name: DB_PASSWORD,         valueFrom: { secretKeyRef: { name: tmvault-secrets, key: DB_PASSWORD } } }
            - { name: JWT_SECRET,          valueFrom: { secretKeyRef: { name: tmvault-secrets, key: JWT_SECRET } } }
            - { name: ENCRYPTION_KEY,      valueFrom: { secretKeyRef: { name: tmvault-secrets, key: ENCRYPTION_KEY } } }
            - { name: RABBITMQ_PASSWORD,   valueFrom: { secretKeyRef: { name: tmvault-secrets, key: RABBITMQ_PASSWORD } } }
            - { name: ONPREM_S3_ACCESS_KEY,valueFrom: { secretKeyRef: { name: tmvault-secrets, key: ONPREM_S3_ACCESS_KEY } } }
            - { name: ONPREM_S3_SECRET_KEY,valueFrom: { secretKeyRef: { name: tmvault-secrets, key: ONPREM_S3_SECRET_KEY } } }
            - { name: APP_1_CLIENT_ID,     valueFrom: { secretKeyRef: { name: tmvault-secrets, key: APP_1_CLIENT_ID } } }
            - { name: APP_1_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: tmvault-secrets, key: APP_1_CLIENT_SECRET } } }
            - { name: APP_1_TENANT_ID,     valueFrom: { secretKeyRef: { name: tmvault-secrets, key: APP_1_TENANT_ID } } }
          resources:
            requests: { cpu: "250m", memory: "1Gi" }
            limits: { cpu: "2", memory: "8Gi" }
