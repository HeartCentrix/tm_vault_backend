apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: tmvault-api-services
  namespace: itops
  labels: { release: kube-prometheus-stack, stack: tmvault }
spec:
  jobLabel: app
  podTargetLabels: [app, stack]
  namespaceSelector: { matchNames: [itops] }
  selector:
    matchLabels: { stack: tmvault }
    matchExpressions:
      - key: app
        operator: In
        values:
          - auth-service
          - tenant-service
          - resource-service
          - job-service
          - snapshot-service
          - dashboard-service
          - alert-service
          - delta-token
          - audit-service
  podMetricsEndpoints:
    - path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_ip]
          regex: "(.+)"
          replacement: "${1}:9103"
          targetLabel: __address__
        - targetLabel: endpoint
          replacement: core-metrics
---
# RabbitMQ: the pod declares 5672 and 15672, so SD emits two targets per endpoint. Keep the
# 15672 one and point it at the rabbitmq_prometheus listener (15692) so each endpoint scrapes
# the broker exactly once. /metrics is the aggregated feed (node alarms, totals);
# /metrics/detailed?family=queue_coarse_metrics&family=queue_metrics adds per-queue
# rabbitmq_detailed_queue_* gauges (messages_ready, consumers, ...) for the queue alerts.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: tmvault-rabbitmq
  namespace: itops
  labels: { release: kube-prometheus-stack, stack: tmvault }
spec:
  jobLabel: app
  podTargetLabels: [app, stack]
  namespaceSelector: { matchNames: [itops] }
  selector:
    matchLabels: { stack: tmvault, app: tmvault-rabbitmq }
  podMetricsEndpoints:
    - path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - action: keep
          sourceLabels: [__meta_kubernetes_pod_container_port_number]
          regex: "15672"
        - sourceLabels: [__meta_kubernetes_pod_ip]
          regex: "(.+)"
          replacement: "${1}:15692"
          targetLabel: __address__
        - targetLabel: endpoint
          replacement: prometheus
    - path: /metrics/detailed
      params:
        family: [queue_coarse_metrics, queue_metrics]
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - action: keep
          sourceLabels: [__meta_kubernetes_pod_container_port_number]
          regex: "15672"
        - sourceLabels: [__meta_kubernetes_pod_ip]
          regex: "(.+)"
          replacement: "${1}:15692"
          targetLabel: __address__
        - targetLabel: endpoint
          replacement: prometheus-detailed
