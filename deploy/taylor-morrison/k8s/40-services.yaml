apiVersion: apps/v1
kind: Deployment
metadata: { name: snapshot-service, namespace: itops, labels: { app: snapshot-service, stack: tmvault } }
spec:
  replicas: 1
  selector: { matchLabels: { app: snapshot-service } }
  template:
    metadata: { labels: { app: snapshot-service, stack: tmvault } }
    spec:
      imagePullSecrets: [ { name: harbor-creds } ]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: snapshot-service
          image: harbor.taylormorrison.com/library/tmvault-snapshot-service@sha256:d1c028a2ce30479e1e73477cc1d83b418919cb205f26da3ca9299eb5a863ba52
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
          ports: [ { containerPort: 8005 } ]
          envFrom:
            - configMapRef: { name: tmvault-config }
          env:
            - { name: PORT, value: "8005" }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: JWT_SECRET } }
            - name: ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: ENCRYPTION_KEY } }
            - name: INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: INTERNAL_API_KEY } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: RABBITMQ_PASSWORD } }
            - name: ONPREM_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: ONPREM_S3_ACCESS_KEY } }
            - name: ONPREM_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: ONPREM_S3_SECRET_KEY } }
            - name: SPA_CLIENT_ID
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: SPA_CLIENT_ID } }
            - name: SPA_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: SPA_CLIENT_SECRET } }
            - name: SPA_TENANT_ID
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: SPA_TENANT_ID } }
            - name: APP_1_CLIENT_ID
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: APP_1_CLIENT_ID } }
            - name: APP_1_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: APP_1_CLIENT_SECRET } }
            - name: APP_1_TENANT_ID
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: APP_1_TENANT_ID } }
          readinessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          # failureThreshold 40: the lifespan folder-path backfill runs
          # unbounded UPDATEs over snapshot_items before /health serves;
          # at 54GB+ table size it exceeded the default 2-min liveness
          # budget and the kubelet killed the pod mid-backfill forever
          # (2026-07-20). Applied live then; persisted here so a re-apply
          # doesn't revert it. Durable fix = move backfill off the
          # serving path, then this can tighten again.
          livenessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 40
          resources:
            requests: { cpu: "50m", memory: "256Mi" }
            # 3Gi: applied live 2026-07-20 when 1.5Gi OOMed on the
            # unbounded /mail materialization; persisted so re-apply
            # doesn't revert. The 2026-07-21 SQL-side pagination fix
            # (_paged_latest_items) removes that failure mode — the
            # limit is deliberate headroom for the remaining aggregate
            # endpoints and can come down once they prove stable.
            limits: { cpu: "500m", memory: "3Gi" }
---
