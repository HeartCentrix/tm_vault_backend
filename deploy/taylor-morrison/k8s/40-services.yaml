---
# ROLLOUT ORDER for the 2026-07-31 authorization fix — auth-service LAST.
#   1. alert-service   2. job-service   3. auth-service
# auth-service is what populates the JWT `tenantIds` claim. Its consumers
# (alert-service, job-service) fail closed while the claim is empty, so
# shipping them first cannot open anything; shipping auth-service first makes
# the claim live against the OLD alert-service, which has no admin guard on
# DELETE /api/v1/access-groups/{id} — a destructive window. job-service
# re-derives entitlement from the database when the claim is absent
# (services/job-service/export_authz.py: entitled_tenants), so it is correct
# either side of the auth-service rollout.
#
# INTERNAL_API_KEY — APPLY THE SECRET FIRST, BEFORE ANY OF THE THREE.
# Services enumerate individual secretKeyRef entries (workers use
# envFrom/secretRef and inherit the whole Secret automatically), so a key that
# is not enumerated here can never reach a service pod no matter what is in
# Secret tmvault-secrets. audit-service VALIDATES this key on
# POST /api/v1/audit/log; job-service, snapshot-service and backup-scheduler
# EMIT with it. Half-configuring it silently 401s the emitters (httpx does not
# raise on 4xx and those call sites swallow), so it is plumbed uniformly to
# every service exactly like JWT_SECRET/ENCRYPTION_KEY.
#   1. kubectl -n itops patch secret tmvault-secrets --type merge \
#        -p "{\"stringData\":{\"INTERNAL_API_KEY\":\"$(openssl rand -hex 32)\"}}"
#   2. kubectl -n itops apply -f 40-services.yaml
# In that order: the ref is NOT optional, so applying this file against a
# Secret without the key leaves every service pod in
# CreateContainerConfigError. That is deliberate — it fails loudly instead of
# leaving the audit gate inert. The SAME value must be used in both lineages'
# manifests; there is one Secret and one audit-service.
apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service, namespace: itops, labels: { app: auth-service, stack: tmvault } }
spec:
  replicas: 1
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service, stack: tmvault } }
    spec:
      imagePullSecrets: [ { name: harbor-creds } ]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: auth-service
          image: harbor.taylormorrison.com/library/tmvault-auth-service@sha256:a60e20eefbcb571d684708797b36f29f8248fa3561ad089607af1b0f693dd2b1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
          ports: [ { containerPort: 8001 } ]
          envFrom:
            - configMapRef: { name: tmvault-config }
          env:
            - { name: PORT, value: "8001" }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: JWT_SECRET } }
            - name: ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: ENCRYPTION_KEY } }
            - name: INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: INTERNAL_API_KEY } }
            - name: REDIS_PASSWORD
              # optional: the code passes password=REDIS_PASSWORD or None, so a
              # missing key means no-auth mode — only the redis container itself
              # hard-requires the secret (fail-loud there is deliberate).
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: REDIS_PASSWORD, optional: true } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: RABBITMQ_PASSWORD } }
            - name: ONPREM_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: ONPREM_S3_ACCESS_KEY } }
            - name: ONPREM_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: ONPREM_S3_SECRET_KEY } }
            - name: SPA_CLIENT_ID
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: SPA_CLIENT_ID } }
            - name: SPA_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: SPA_CLIENT_SECRET } }
            - name: SPA_TENANT_ID
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: SPA_TENANT_ID } }
            - name: APP_1_CLIENT_ID
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: APP_1_CLIENT_ID } }
            - name: APP_1_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: APP_1_CLIENT_SECRET } }
            - name: APP_1_TENANT_ID
              valueFrom: { secretKeyRef: { name: tmvault-secrets, key: APP_1_TENANT_ID } }
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: auth-service, namespace: itops, labels: { app: auth-service, stack: tmvault } }
spec:
  selector: { app: auth-service }
  ports: [ { port: 8001, targetPort: 8001 } ]
