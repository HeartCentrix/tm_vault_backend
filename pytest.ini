[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
# Cap every test so an infinite retry/await loop fails with a traceback
# instead of hanging the run (see requirements-test.txt). Generous enough
# that no honest unit test is affected; override with --timeout=0 when
# running the integration/slow suites against real services.
timeout = 120

markers =
    integration: marks tests that require docker services (deselect with '-m "not integration"')
    slow: marks load / performance tests
    worm: WORM / Object Lock parity tests
    chaos: fault-injection / chaos drills
filterwarnings =
    ignore::DeprecationWarning
